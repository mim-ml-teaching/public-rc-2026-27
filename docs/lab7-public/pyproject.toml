[project]
name = "mpc-drone-lab"
version = "0.1.0"
description = "Parallel Genesis drone racing environment for the MPC laboratory"
readme = "lab7.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "genesis-world==1.4.5",
    "matplotlib>=3.8",
    "torch>=2.9.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
